# Duck Insight 实时数仓栈：MySQL (Binlog) -> Flink CDC -> Kafka (KRaft) -> Apache Doris (FE + BE)
#
# 推荐部署步骤（Linux 宿主机，建议 >= 8GB 可用内存）：
#   1. cp docker/.env.realtime.example docker/.env.realtime   # 按需修改密码与宿主机 IP
#   2. sudo bash docker/realtime/prepare-host.sh              # 配置 vm.max_map_count 与关闭 swap
#   3. bash docker/realtime/download-flink-jars.sh            # 下载 Flink CDC / Kafka / MySQL 连接器
#   4. docker compose --env-file docker/.env.realtime -f docker/docker-compose.realtime.yml up -d
#   5. 等待 FE/BE 均 Alive 后初始化表和 Routine Load：
#      mysql -h 127.0.0.1 -P 9030 -u root < docker/realtime/init-doris.sql
#
# 如需与主站（backend + web）同网段一起启动：
#   docker compose --env-file docker/.env.realtime -f docker/docker-compose.yml -f docker/docker-compose.realtime.yml up -d

name: duck-insight-realtime

services:
  mysql:
    image: mysql:8.0
    container_name: realtime-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${RT_MYSQL_ROOT_PASSWORD:?请在 .env.realtime 中设置 RT_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${RT_MYSQL_DATABASE:-ecommerce}
      TZ: Asia/Shanghai
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-expire-logs-seconds=604800
      - --default-time-zone=+08:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
    ports:
      - "${RT_MYSQL_BIND:-127.0.0.1}:${RT_MYSQL_PORT:-3307}:3306"
    volumes:
      - realtime-mysql-data:/var/lib/mysql
    mem_limit: 768m

  kafka:
    image: apache/kafka:3.8.1
    container_name: realtime-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
      - "${KAFKA_EXTERNAL_BIND:-127.0.0.1}:${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-127.0.0.1}:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}"
    volumes:
      - realtime-kafka-data:/var/lib/kafka/data
    mem_limit: 1024m

  jobmanager:
    image: flink:1.18.1-scala_2.12
    container_name: realtime-jobmanager
    hostname: jobmanager
    restart: unless-stopped
    command: jobmanager
    ports:
      - "${FLINK_REST_BIND:-127.0.0.1}:${FLINK_REST_PORT:-8081}:8081"
    environment:
      TZ: Asia/Shanghai
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 768m
        taskmanager.memory.process.size: 1280m
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-4}
        parallelism.default: 1
        execution.checkpointing.interval: 10000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        state.backend: hashmap
        state.checkpoint-storage: filesystem
        state.checkpoints.dir: file:///opt/flink/state/checkpoints
        state.savepoints.dir: file:///opt/flink/state/savepoints
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
    volumes:
      - ./realtime/lib/flink-sql-connector-mysql-cdc-3.1.1.jar:/opt/flink/lib/flink-sql-connector-mysql-cdc-3.1.1.jar:ro
      - ./realtime/lib/flink-sql-connector-kafka-3.2.0-1.18.jar:/opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.18.jar:ro
      - ./realtime/lib/mysql-connector-j-8.0.33.jar:/opt/flink/lib/mysql-connector-j-8.0.33.jar:ro
      - ./realtime/state:/opt/flink/state
      - ./realtime/sql:/opt/sql:ro
    mem_limit: 1024m

  taskmanager:
    image: flink:1.18.1-scala_2.12
    container_name: realtime-taskmanager
    hostname: taskmanager
    restart: unless-stopped
    command: taskmanager
    environment:
      TZ: Asia/Shanghai
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 768m
        taskmanager.memory.process.size: 1280m
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-4}
        parallelism.default: 1
        execution.checkpointing.interval: 10000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        state.backend: hashmap
        state.checkpoint-storage: filesystem
        state.checkpoints.dir: file:///opt/flink/state/checkpoints
        state.savepoints.dir: file:///opt/flink/state/savepoints
    volumes:
      - ./realtime/lib/flink-sql-connector-mysql-cdc-3.1.1.jar:/opt/flink/lib/flink-sql-connector-mysql-cdc-3.1.1.jar:ro
      - ./realtime/lib/flink-sql-connector-kafka-3.2.0-1.18.jar:/opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.18.jar:ro
      - ./realtime/lib/mysql-connector-j-8.0.33.jar:/opt/flink/lib/mysql-connector-j-8.0.33.jar:ro
      - ./realtime/state:/opt/flink/state
    mem_limit: 1536m
    depends_on:
      - jobmanager

  doris-fe:
    image: apache/doris:fe-2.1.7
    container_name: realtime-doris-fe
    hostname: doris-fe
    restart: unless-stopped
    environment:
      FE_SERVERS: fe1:172.30.0.10:9010
      FE_ID: 1
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xmx1024m -Xms512m -XX:+UseG1GC"
    ports:
      - "${DORIS_QUERY_BIND:-127.0.0.1}:${DORIS_QUERY_PORT:-9030}:9030"
      - "${DORIS_HTTP_BIND:-127.0.0.1}:${DORIS_HTTP_PORT:-8030}:8030"
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    networks:
      default:
      doris-net:
        ipv4_address: 172.30.0.10
    mem_limit: 1792m

  doris-be:
    image: apache/doris:be-2.1.7
    container_name: realtime-doris-be
    hostname: doris-be
    restart: unless-stopped
    environment:
      FE_SERVERS: fe1:172.30.0.10:9010
      BE_ADDR: 172.30.0.11:9050
      TZ: Asia/Shanghai
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    networks:
      default:
      doris-net:
        ipv4_address: 172.30.0.11
    mem_limit: 2816m
    depends_on:
      - doris-fe

networks:
  doris-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  realtime-mysql-data:
  realtime-kafka-data:
  doris-fe-meta:
  doris-fe-log:
  doris-be-storage:
  doris-be-log:
