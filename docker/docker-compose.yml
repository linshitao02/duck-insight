name: duck-insight

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: duck-insight-backend
    environment:
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-insight_forge}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      TZ: Asia/Shanghai
    volumes:
      - duck-insight-data:/app/storage
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: duck-insight-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  duck-insight-data:
